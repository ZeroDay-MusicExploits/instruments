<script>
/* ZD-BLOCK:zd-mobile v4 */
/* Shell portrait-first: barra superior 48px + zona de tocar + tabs 56px +
   bottom sheets. Se configura entero por window.ZD_M (ningun selector ni
   texto del instrumento vive aca). Un solo movimiento de nodos por activacion:
   la media query de activacion no menciona la orientacion, asi que rotar el
   telefono no vuelve a mover nada.
   v3: entrar y salir son idempotentes y reversibles. El movimiento de nodos
   salio de build() (que corre una sola vez) y vive en enter(), asi que volver
   a entrar despues de un exit() vuelve a armar el shell en vez de dejar el
   stage vacio. Ademas el ciclo conserva el foco y el scroll de la pagina.
   v4: los controles de la barra superior miden 44px en los dos ejes (SPEC R1). */
(function () {
  'use strict';
  var ZD = window.ZD || (window.ZD = {});
  if (ZD.mobile) return;

  var CSS = [
    /* ---- metricas y reset del shell ---- */
    'html.zd-m{height:100%}',
    'html.zd-m body{margin:0!important;padding:0!important;min-height:0!important;height:100%;overflow:hidden;',
    '--zd-top-h:48px;--zd-tabs-h:56px;--zd-sat:env(safe-area-inset-top,0px);--zd-sab:env(safe-area-inset-bottom,0px);',
    '--zd-sal:env(safe-area-inset-left,0px);--zd-sar:env(safe-area-inset-right,0px);',
    '--zd-stage-h:calc(100vh - var(--zd-top-h) - var(--zd-tabs-h) - var(--zd-sat) - var(--zd-sab))}',
    '@supports (height:100dvh){html.zd-m body{--zd-stage-h:calc(100dvh - var(--zd-top-h) - var(--zd-tabs-h) - var(--zd-sat) - var(--zd-sab))}}',
    'html.zd-m body::before{display:none}',
    'html.zd-m .wrap{display:none!important}',
    'html:not(.zd-m) #zd-top,html:not(.zd-m) #zd-stage,html:not(.zd-m) #zd-tabs,',
    'html:not(.zd-m) #zd-scrim,html:not(.zd-m) #zd-sheet{display:none!important}',

    /* ---- barra superior ---- */
    '#zd-top{position:fixed;z-index:40;left:0;right:0;top:0;display:flex;align-items:center;gap:7px;',
    'height:calc(var(--zd-top-h) + var(--zd-sat));padding:var(--zd-sat) calc(8px + var(--zd-sar)) 0 calc(8px + var(--zd-sal));',
    'background:var(--zd-chassis,#0d140b);border-bottom:2px solid var(--zd-outline,#000);',
    'box-shadow:0 1px 0 var(--zd-line,#2a3f24),0 10px 24px -14px #000;',
    'font-family:var(--zd-mono,monospace);color:var(--zd-ink,#e9ebef)}',
    '#zd-top .zd-tlogo{height:30px;width:auto;flex:none;background:var(--zd-paper,#ecebe5);padding:2px;border-radius:2px;',
    'box-shadow:0 0 0 1px var(--zd-outline,#000),0 2px 0 var(--zd-outline,#000)}',
    '#zd-top .zd-ttitle{font-size:12px;font-weight:800;letter-spacing:.04em;white-space:nowrap;flex:none}',
    '#zd-top .zd-ttitle b{color:var(--inst-accent,var(--zd-phosphor,#7fdc5c))}',
    '#zd-top .zd-ttr{display:flex;align-items:center;gap:6px;margin-left:auto;min-width:0;overflow:hidden}',
    '#zd-top .zd-ttr>*{margin:0!important}',
    /* SPEC R1: target tactil >=44px en el eje corto. La barra mide 48, asi que
       44 entra. Es un piso generico para cualquier control que termine en la
       barra: los del transporte (del instrumento), el icono de instalar (que
       inyecta zd-pwa con 40x40 fijos) y el de menu de aca. min-width/min-height
       ganan sobre un width/height fijo sin importar la especificidad, y van sin
       !important para que el skin de un instrumento pueda decidir otra cosa a
       sabiendas (lo chequea tools/tests/zd-mobile-cycle.test.mjs). */
    '#zd-top button,#zd-top a,#zd-top input,#zd-top select{min-width:44px;min-height:44px}',
    '#zd-tmenu{flex:none;width:44px;height:44px;cursor:pointer;font:700 15px var(--zd-mono,monospace);',
    'color:var(--zd-ink,#e9ebef);background:var(--zd-panel-2,#1c2430);border:1px solid var(--zd-outline,#000);',
    'border-radius:var(--zd-r,4px);box-shadow:0 0 0 1px var(--zd-line,#2a3f24),0 2px 0 var(--zd-outline,#000);touch-action:manipulation}',
    '#zd-tmenu:active{transform:translateY(2px);box-shadow:0 0 0 1px var(--zd-line,#2a3f24)}',
    '@media (max-width:359px){#zd-top .zd-ttitle{display:none}}',

    /* ---- zona de tocar ---- */
    '#zd-stage{position:fixed;left:0;right:0;z-index:10;display:flex;flex-direction:column;gap:6px;',
    'top:calc(var(--zd-top-h) + var(--zd-sat));height:var(--zd-stage-h);',
    'padding:6px calc(7px + var(--zd-sar)) 6px calc(7px + var(--zd-sal));',
    'overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}',
    '#zd-stage>*{margin:0!important;min-height:0}',

    /* ---- tabs ---- */
    '#zd-tabs{position:fixed;z-index:42;left:0;right:0;bottom:0;display:flex;align-items:stretch;',
    'height:calc(var(--zd-tabs-h) + var(--zd-sab));padding:0 var(--zd-sar) var(--zd-sab) var(--zd-sal);',
    'background:var(--zd-chassis,#0d140b);border-top:2px solid var(--zd-outline,#000);',
    'box-shadow:0 -1px 0 var(--zd-line,#2a3f24),0 -10px 24px -14px #000}',
    '#zd-tabs button{flex:1 1 0;min-width:0;min-height:52px;display:flex;align-items:center;justify-content:center;',
    'cursor:pointer;background:transparent;border:0;border-right:1px solid var(--zd-line-soft,#1d2c19);',
    'font:700 11.5px var(--zd-mono,monospace);letter-spacing:.07em;color:var(--zd-ink-dim,#a3b699);',
    'touch-action:manipulation;padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}',
    '#zd-tabs button:last-child{border-right:0}',
    '#zd-tabs button[aria-expanded=true]{color:var(--zd-void,#070b06);background:var(--inst-accent,var(--zd-phosphor,#7fdc5c))}',

    /* ---- scrim + sheet ---- */
    '#zd-scrim{position:fixed;z-index:44;left:0;right:0;top:calc(var(--zd-top-h) + var(--zd-sat));',
    'bottom:calc(var(--zd-tabs-h) + var(--zd-sab));background:rgba(3,5,2,.6);opacity:0;visibility:hidden;',
    'transition:opacity .16s,visibility 0s .16s}',
    'html.zd-m.zd-sheet-full #zd-scrim{opacity:1;visibility:visible;transition:opacity .16s}',
    '#zd-sheet{position:fixed;z-index:45;left:0;right:0;bottom:calc(var(--zd-tabs-h) + var(--zd-sab));',
    'display:flex;flex-direction:column;max-height:70dvh;',
    'padding:0 calc(7px + var(--zd-sar)) 8px calc(7px + var(--zd-sal));',
    'background:var(--zd-panel,#111b0f);border-top:2px solid var(--zd-outline,#000);',
    'box-shadow:0 -1px 0 var(--inst-accent,var(--zd-phosphor,#7fdc5c)),0 -26px 44px -16px #000;',
    'font-family:var(--zd-mono,monospace);color:var(--zd-ink,#e9ebef);',
    'transform:translateY(110%);transition:transform .18s ease-out;visibility:hidden}',
    '@supports not (height:100dvh){#zd-sheet{max-height:70vh}}',
    '#zd-sheet.peek{max-height:45dvh}',
    'html.zd-m.zd-sheet-open #zd-sheet{transform:none;visibility:visible}',
    '#zd-sheet .zd-handle{flex:none;align-self:center;width:72px;height:26px;margin:0;padding:0;border:0;background:transparent;',
    'cursor:grab;touch-action:none;display:flex;align-items:center;justify-content:center}',
    '#zd-sheet .zd-handle::before{content:"";width:46px;height:4px;border-radius:2px;background:var(--zd-line,#2a3f24)}',
    '#zd-sheet .zd-shead{flex:none;display:flex;align-items:center;gap:8px;padding:0 2px 7px}',
    '#zd-sheet .zd-sdot{width:9px;height:9px;flex:none;border-radius:2px;background:var(--inst-accent,var(--zd-phosphor,#7fdc5c));',
    'box-shadow:0 0 8px var(--inst-accent,var(--zd-phosphor,#7fdc5c))}',
    '#zd-sheet h2{flex:1;margin:0;font-size:11.5px;font-weight:800;letter-spacing:.18em;color:var(--zd-ink-dim,#a3b699);',
    'white-space:nowrap;overflow:hidden;text-overflow:ellipsis}',
    '#zd-sheet .zd-sclose{flex:none;width:44px;height:36px;cursor:pointer;font-size:14px;color:var(--zd-ink,#e9ebef);',
    'background:var(--zd-panel-2,#1c2430);border:1px solid var(--zd-outline,#000);border-radius:var(--zd-r,4px);',
    'box-shadow:0 0 0 1px var(--zd-line,#2a3f24);touch-action:manipulation}',
    '#zd-sheet .zd-sbody{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:2px 2px 4px}',
    '#zd-sheet .zd-pane{display:none;flex-direction:column;gap:9px}',
    '#zd-sheet .zd-pane.on{display:flex}',
    '#zd-sheet .zd-pane>*{margin:0!important}',
    '#zd-sheet .zd-mitem{display:flex;align-items:center;gap:9px;min-height:48px;padding:0 12px;text-decoration:none;',
    'cursor:pointer;font:700 12.5px var(--zd-mono,monospace);letter-spacing:.05em;color:var(--zd-ink,#e9ebef);',
    'background:var(--zd-well,#050804);border:1px solid var(--zd-outline,#000);border-radius:var(--zd-r,4px);',
    'box-shadow:0 0 0 1px var(--zd-line,#2a3f24);touch-action:manipulation;text-align:left;width:100%}',
    '#zd-sheet .zd-mitem[hidden]{display:none}',
    '#zd-sheet .zd-mnote{font-size:11.5px;line-height:1.5;color:var(--zd-ink-faint,#859a7b);padding:2px 2px 0}',
    '@media (prefers-reduced-motion:reduce){#zd-sheet,#zd-scrim{transition:none}}'
  ].join('');

  /* La media query de activacion no menciona orientacion: rotar no re-mueve nodos. */
  var MQ = '(pointer:coarse) and (max-width:1024px), (max-width:820px)';
  var mq = window.matchMedia(MQ);

  var st = document.createElement('style');
  st.id = 'zd-mobile-css';
  st.textContent = CSS;
  (document.head || document.documentElement).appendChild(st);
  if (mq.matches) document.documentElement.classList.add('zd-m');

  function mk(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function all(sel) {
    if (typeof sel === 'function') { try { return [].concat(sel()).filter(Boolean); } catch (e) { return []; } }
    if (sel && sel.nodeType) return [sel];
    try { return Array.prototype.slice.call(document.querySelectorAll(sel)); } catch (e) { return []; }
  }

  var built = false, active = false, moves = [], open = null;
  var top, stage, tabsBar, scrim, sheet, sheetBody, sheetTitle, panes = {}, tabBtns = {}, cfgTabs = [], C = null;
  /* trRef: la columna de transporte de la barra superior. build() corre una sola
     vez, pero moveNodes() corre en cada enter(), asi que el destino se guarda. */
  var trRef = null, savedFocus = null, savedScroll = null;

  function build() {
    if (built) return;
    built = true;
    C = window.ZD_M || {};
    cfgTabs = (C.tabs || []).slice(0, 5);

    top = mk('div'); top.id = 'zd-top';
    var logoSrc = C.logo || (function () { var l = document.querySelector('.zd-logo, .brand img'); return l ? l.getAttribute('src') : ''; })();
    if (logoSrc) {
      var logo = mk('img', 'zd-tlogo');
      logo.alt = C.logoAlt || 'Zero Day · Music Exploits';
      logo.src = logoSrc;
      top.appendChild(logo);
    }
    var ttl = mk('span', 'zd-ttitle');
    buildTitle(ttl, C.titleParts || C.name || '');
    top.appendChild(ttl);
    var tr = mk('div', 'zd-ttr');
    trRef = tr;
    top.appendChild(tr);
    var menuBtn = mk('button', null, '⋯');
    menuBtn.id = 'zd-tmenu'; menuBtn.type = 'button';
    menuBtn.setAttribute('aria-label', 'Menú');
    menuBtn.setAttribute('aria-expanded', 'false');
    menuBtn.setAttribute('aria-haspopup', 'dialog');
    top.appendChild(menuBtn);

    stage = mk('main'); stage.id = 'zd-stage';

    tabsBar = mk('nav'); tabsBar.id = 'zd-tabs';
    tabsBar.setAttribute('aria-label', 'Secciones');

    scrim = mk('div'); scrim.id = 'zd-scrim';

    sheet = mk('div'); sheet.id = 'zd-sheet';
    sheet.setAttribute('role', 'dialog');
    sheet.setAttribute('aria-modal', 'false');
    var handle = mk('button', 'zd-handle');
    handle.type = 'button'; handle.setAttribute('aria-label', 'Cerrar panel');
    var head = mk('div', 'zd-shead');
    head.appendChild(mk('span', 'zd-sdot'));
    sheetTitle = mk('h2');
    var hid = 'zd-sheet-title';
    sheetTitle.id = hid;
    sheet.setAttribute('aria-labelledby', hid);
    head.appendChild(sheetTitle);
    var close = mk('button', 'zd-sclose', '✕');
    close.type = 'button'; close.setAttribute('aria-label', 'Cerrar panel');
    head.appendChild(close);
    sheetBody = mk('div', 'zd-sbody');
    sheet.append(handle, head, sheetBody);

    cfgTabs.forEach(function (t) {
      var pane = mk('div', 'zd-pane');
      pane.dataset.tab = t.id;
      sheetBody.appendChild(pane);
      panes[t.id] = pane;
      var b = mk('button', null, t.label);
      b.type = 'button';
      b.dataset.tab = t.id;
      b.setAttribute('aria-expanded', 'false');
      b.setAttribute('aria-controls', 'zd-sheet');
      b.addEventListener('click', function () { toggle(t.id); });
      tabsBar.appendChild(b);
      tabBtns[t.id] = b;
    });

    /* panel de menu: "<- Sitio", instalar y lo que agregue la config */
    var menuPane = mk('div', 'zd-pane');
    menuPane.dataset.tab = '__menu';
    sheetBody.appendChild(menuPane);
    panes.__menu = menuPane;
    (C.menu || []).forEach(function (m) {
      var node;
      if (m.href) {
        node = mk('a', 'zd-mitem', m.label);
        node.href = m.href;
        node.rel = 'noopener';
        if (m.target) node.target = m.target;
      } else {
        node = mk('button', 'zd-mitem', m.label);
        node.type = 'button';
        if (m.onClick) node.addEventListener('click', function () { close_(); m.onClick(); });
      }
      if (m.id) node.id = m.id;
      if (m.hidden) node.hidden = true;
      menuPane.appendChild(node);
    });
    (C.menuNotes || []).forEach(function (txt) { menuPane.appendChild(mk('div', 'zd-mnote', txt)); });
    menuBtn.addEventListener('click', function () { toggle('__menu'); });
    tabBtns.__menu = menuBtn;

    document.body.append(top, stage, tabsBar, scrim, sheet);

    close.addEventListener('click', close_);
    scrim.addEventListener('click', close_);
    window.addEventListener('keydown', function (e) { if (e.key === 'Escape' && open) { e.stopPropagation(); close_(); } });
    dragToClose(handle);
    dragToClose(head);
  }

  /* El titulo acepta ['ACID ','BASS-303'] -> el 2do tramo va en <b>. */
  function buildTitle(host, parts) {
    var list = Array.isArray(parts) ? parts : [String(parts)];
    list.forEach(function (p, i) {
      if (i % 2 === 1) { var b = document.createElement('b'); b.textContent = p; host.appendChild(b); }
      else host.appendChild(document.createTextNode(p));
    });
  }

  function moveNodes(tr) {
    var plan = [];
    function q(list, target) { (list || []).forEach(function (s) { all(s).forEach(function (n) { plan.push([n, target]); }); }); }
    q(C.transport, tr);
    q(C.keep, stage);
    cfgTabs.forEach(function (t) { q(t.nodes, panes[t.id]); });
    plan.forEach(function (p) {
      var n = p[0], t = p[1];
      if (!t || !n || !n.parentNode) return;
      var ph = document.createComment('zd-m');
      n.parentNode.insertBefore(ph, n);
      t.appendChild(n);
      moves.push({ n: n, ph: ph });
    });
  }
  function restoreNodes() {
    for (var i = moves.length - 1; i >= 0; i--) {
      var m = moves[i];
      if (m.ph.parentNode) { m.ph.parentNode.insertBefore(m.n, m.ph); m.ph.remove(); }
    }
    moves = [];
  }

  function fire() { requestAnimationFrame(function () { window.dispatchEvent(new Event('resize')); }); }

  function show(id) {
    var tab = id === '__menu' ? { id: '__menu', title: (C.menuTitle || 'MENÚ'), peek: false } : cfgTabs.filter(function (t) { return t.id === id; })[0];
    if (!tab) return;
    open = id;
    for (var k in panes) panes[k].classList.toggle('on', k === id);
    for (var b in tabBtns) tabBtns[b].setAttribute('aria-expanded', b === id ? 'true' : 'false');
    sheetTitle.textContent = tab.title || tab.label || '';
    sheet.classList.toggle('peek', !!tab.peek);
    sheet.setAttribute('aria-modal', tab.peek ? 'false' : 'true');
    sheet.style.transform = '';
    document.documentElement.classList.add('zd-sheet-open');
    document.documentElement.classList.toggle('zd-sheet-full', !tab.peek);
    if (ZD.mobile) ZD.mobile.openTab = id;
    fire();
  }
  function close_() {
    if (!open) return;
    open = null;
    for (var k in panes) panes[k].classList.remove('on');
    for (var b in tabBtns) tabBtns[b].setAttribute('aria-expanded', 'false');
    sheet.style.transform = '';
    document.documentElement.classList.remove('zd-sheet-open', 'zd-sheet-full');
    if (ZD.mobile) ZD.mobile.openTab = null;
    fire();
  }
  function toggle(id) { if (open === id) close_(); else show(id); }

  /* swipe hacia abajo sobre el handle / cabecera para cerrar */
  function dragToClose(el) {
    var y0 = 0, t0 = 0, dragging = false;
    el.addEventListener('pointerdown', function (e) {
      if (e.target.closest && e.target.closest('.zd-sclose')) return;
      dragging = true; y0 = e.clientY; t0 = performance.now();
      sheet.style.transition = 'none';
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
    });
    el.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      var dy = Math.max(0, e.clientY - y0);
      sheet.style.transform = 'translateY(' + dy + 'px)';
    });
    function end(e) {
      if (!dragging) return;
      dragging = false;
      sheet.style.transition = '';
      try { el.releasePointerCapture(e.pointerId); } catch (_) {}
      var dy = Math.max(0, e.clientY - y0), dt = performance.now() - t0;
      sheet.style.transform = '';
      if (dy > 64 || (dy > 24 && dt < 220)) close_();
    }
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  }

  /* Mover un nodo lo saca y lo vuelve a insertar: eso borra el foco y, al
     entrar, el body pasa a overflow:hidden y se pierde el scroll de la pagina.
     Se guardan antes y se devuelven despues, asi el ciclo es reversible. */
  function focusable(el) {
    return el && el !== document.body && el !== document.documentElement &&
      typeof el.focus === 'function' ? el : null;
  }
  function restoreFocus() {
    var el = savedFocus;
    savedFocus = null;
    if (!el || !document.contains(el) || document.activeElement === el) return;
    try { el.focus({ preventScroll: true }); } catch (e) { try { el.focus(); } catch (_) {} }
  }

  function enter() {
    if (active) return;
    savedFocus = focusable(document.activeElement);
    savedScroll = [window.pageXOffset || 0, window.pageYOffset || 0];
    build();
    /* restoreNodes() vacia moves, asi que esto cubre el primer enter() y
       cualquier reentrada posterior sin mover nada dos veces. */
    if (!moves.length) moveNodes(trRef);
    active = true;
    document.documentElement.classList.add('zd-m');
    restoreFocus();
    if (C && C.onEnter) try { C.onEnter(); } catch (e) {}
    fire();
  }
  function exit() {
    if (!active) return;
    savedFocus = focusable(document.activeElement);
    active = false;
    close_();
    restoreNodes();
    document.documentElement.classList.remove('zd-m');
    restoreFocus();
    if (savedScroll) {
      /* leer una metrica fuerza el reflow ya sin la clase zd-m: si no, scrollTo
         clampea contra el alto del shell (una pantalla) y queda en 0, y despues
         el scroll anchoring del navegador lo deja en cualquier lado */
      void document.documentElement.scrollHeight;
      try { window.scrollTo(savedScroll[0], savedScroll[1]); } catch (e) {}
      savedScroll = null;
    }
    if (C && C.onExit) try { C.onExit(); } catch (e) {}
    fire();
  }
  function apply() {
    if (mq.matches) enter();
    else { if (built) exit(); else document.documentElement.classList.remove('zd-m'); }
  }

  function init() {
    apply();
    if (mq.addEventListener) mq.addEventListener('change', apply);
    else if (mq.addListener) mq.addListener(apply);
  }

  ZD.mobile = {
    mq: MQ,
    get active() { return active; },
    openTab: null,
    open: show, close: close_, toggle: toggle,
    stage: function () { return stage; },
    pane: function (id) { return panes[id]; }
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
/* /ZD-BLOCK:zd-mobile */
</script>
